name: Sync fork and package desktop

# 每天北京时间 00:00（= UTC 16:00）自动同步上游 GCWing/OpenBitFun，
# 并按当天的 beta 序号触发 desktop-package.yml 打包。
# 也可以在 Actions 页面手动触发（Run workflow）。

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC：UTC 16:00 = 北京时间次日 00:00。
    # 注意：高峰期定时触发可能延迟几分钟到几十分钟，属正常现象。
    - cron: '0 16 * * *'
  workflow_dispatch:

# 向 fork 的 main 推送合并提交需要 contents: write；
# 触发 desktop-package.yml（workflow_dispatch API）需要 actions: write。
# 注意：不要在这里加 workflows: write——GitHub 运行时会拒绝整个文件，
# 导致本 workflow 显示为路径名、运行时 startup_failure（v4 的教训）。
permissions:
  contents: write
  actions: write

concurrency:
  group: sync-fork-and-package
  cancel-in-progress: false

env:
  # gh CLI 在无 checkout 的目录里无法推断仓库，显式指定最稳妥
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  # ── beta 序号规则：tag = v1.0.0-beta.(TAG_BASE + 与 TAG_ANCHOR 相差的天数，最小为 0) ──
  # 北京时间 2026-09-21 当天构建 = v1.0.0-beta.17，之后每天 +1（如 09-23 → beta.19）。
  # 想改起始号/起始日就改这两个变量。
  TAG_BASE: '17'
  TAG_ANCHOR: '2026-09-21'
  # 同步与打包使用的分支
  BUILD_BRANCH: 'main'
  # 上游仓库
  UPSTREAM_REPO: 'GCWing/OpenBitFun'

jobs:
  sync-and-package:
    runs-on: ubuntu-latest
    steps:
      # 完整历史 checkout：合并与统计落后提交数都需要
      - name: Check out fork (main, full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git 直接同步：fetch 上游 -> merge -> push。
      # GITHUB_TOKEN 无法更新 .github/workflows/ 下的文件；若上游这次改动
      # 包含 workflow 文件导致推送被拒收，则自动降级为“只同步代码”的合并提交。
      - name: Sync main with upstream
        # 同步失败不阻断当天打包；想让失败即停就删除下面这行
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${BUILD_BRANCH}"
          BASE="$(git rev-parse HEAD)"
          BEHIND="$(git rev-list --count "${BUILD_BRANCH}..upstream/${BUILD_BRANCH}")"
          if [ "${BEHIND}" -eq 0 ]; then
            echo "fork ${BUILD_BRANCH} 已包含上游全部提交，无需同步"
            exit 0
          fi
          echo "上游有 ${BEHIND} 个新提交（最新：$(git log -1 --format='%h %ad %s' --date=short "upstream/${BUILD_BRANCH}")），开始合并 ..."
          if ! git merge "upstream/${BUILD_BRANCH}" --no-edit; then
            echo "合并出现冲突，无法自动同步；请在 fork 页面处理，或把日志发给助手。"
            exit 1
          fi
          if git push origin "${BUILD_BRANCH}"; then
            echo "已将上游 ${BEHIND} 个新提交合并进 ${BUILD_BRANCH} 并推送"
            exit 0
          fi
          echo "推送被拒收：上游这次改动包含 .github/workflows/ 下的文件，GITHUB_TOKEN 无权更新它们。"
          echo "降级为只同步代码：workflow 文件保持本仓库现状。"
          git reset --hard "${BASE}"
          if ! git merge "upstream/${BUILD_BRANCH}" --no-commit --no-ff >/dev/null 2>&1; then
            git merge --abort >/dev/null 2>&1 || true
            echo "自动同步失败（重试合并异常）；请在 fork 页面手动 Sync fork，或把日志发给助手。"
            exit 1
          fi
          git checkout "${BASE}" -- .github/workflows
          if git diff --cached --quiet -- . ':(exclude).github/workflows'; then
            git merge --abort >/dev/null 2>&1 || true
            echo "上游这次只改了 workflow 文件，已全部跳过；如需更新它们，请在 fork 页面点 Sync fork → Update branch。"
          else
            git commit -m "Merge upstream ${BUILD_BRANCH} (code changes only)" >/dev/null
            git merge --abort >/dev/null 2>&1 || true
            git push origin "${BUILD_BRANCH}"
            echo "已同步上游代码改动（不含上游 workflow 文件的更新；可用 fork 页面 Sync fork 手动拉取）。"
          fi

      - name: Compute today's beta tag
        id: tag
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          DAYS=$(( ( $(date -d "${TODAY}" +%s) - $(date -d "${TAG_ANCHOR}" +%s) ) / 86400 ))
          if [ "${DAYS}" -lt 0 ]; then DAYS=0; fi
          TAG="v1.0.0-beta.$(( TAG_BASE + DAYS ))"
          echo "北京时间 ${TODAY} → ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Trigger desktop-package.yml
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run desktop-package.yml --ref "${BUILD_BRANCH}" \
            -f tag_name="${TAG}" \
            -f checkout_ref="${BUILD_BRANCH}" \
            -f release_channel=beta \
            -F upload_to_release=false
          echo "已触发 Desktop Package：tag=${TAG}，channel=beta，checkout=${BUILD_BRANCH}"
